# SonarQube Scanner Configuration
sonar.projectKey=pert-smart-transport-ciap
sonar.projectName=PERT Smart Transportation CIAP
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=test_*.py
sonar.inclusions=app.py,pert_engine.py,static/**,templates/**

# Exclusions
sonar.exclusions=venv/**,.venv/**,terraform/**,htmlcov/**,.pytest_cache/**,node_modules/**

# Encoding & Python settings
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11
